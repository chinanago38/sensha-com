name: Daily rebuild
# 毎日0時過ぎ（日本時間）にページを作り直し、トップの「次の駐屯地祭」を最新にする
on:
  schedule:
    - cron: "7 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Daily rebuild" && git pull --rebase origin main && git push)
